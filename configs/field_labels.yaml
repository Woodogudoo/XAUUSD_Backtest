guards.gap.threshold_pct:         { label: "เกณฑ์ Gap", unit: "%", help: "ถ้า gap > R55 × ค่านี้ → เข้าโหมดเว้นเทรด" }
guards.gap.wait_bars:             { label: "เว้นหลัง Gap", unit: "แท่ง", help: "หลังเจอ gap แรง เว้นเทรดกี่แท่ง" }

